# Release build of the desktop app (packages/app): runs when a release is published for a tag
# app-v<version>, and fails unless that version is the one in packages/app/package.json. Never on a
# push or a pull request. Run by hand (workflow_dispatch) with a version and a platform, it rebuilds
# that platform for the existing release app-v<version>: GitHub drops a job left queued for the
# self-hosted Mac after 24 hours.
#
# Windows builds on GitHub's windows-latest; macOS on the self-hosted MacBook, by its explicit
# labels, so it can never land on a GitHub-hosted Mac. The two jobs are independent: each uploads
# its own files to the release as soon as it is done, so Windows never waits for the Mac. The macOS
# job alone is in a concurrency group that cancels an older one, queued or running, when a newer
# release starts one. Each is signed when its secrets are set and built unsigned, with a warning,
# when they aren't (packages/app/README.md lists them). For each platform the release gets
# isoplan-app-<version>-<platform>-<arch>.tar.gz, its .sha256, and, uploaded last,
# isoplan-app-<platform>-<arch>.json, which the plugin's install reads
# (packages/mod/src/install/app.ts): `{ version, file, size, sha256 }`. A platform without it isn't
# built yet, and its machines keep the runner on node.
name: Desktop app release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "The app version to rebuild, as in packages/app/package.json. Its release, app-v<version>, must exist."
        required: true
        type: string
      platform:
        description: Which platform to rebuild
        required: true
        type: choice
        options: [both, windows, macos]
        default: both

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || format('app-v{0}', inputs.version) }}

jobs:
  windows:
    if: ${{ (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'app-v')) || (github.event_name == 'workflow_dispatch' && inputs.platform != 'macos') }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the tag names the app's version
        id: version
        run: |
          $version = node -p "require('./packages/app/package.json').version"
          if ($env:TAG -ne "app-v$version") { Write-Error "The tag $env:TAG doesn't match packages/app/package.json, which is at $version; tag it app-v$version."; exit 1 }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @isoplan/app test
      # Electrobun's toolchain comes from GitHub releases, which answered 504 once; tried three times.
      - name: Prepare Electrobun's toolchain
        working-directory: packages/app
        run: |
          foreach ($try in 1..3) { npx electrobun prepare; if ($LASTEXITCODE -eq 0) { exit 0 }; Start-Sleep -Seconds (20 * $try) }
          exit 1
      - name: Build
        working-directory: packages/app
        run: pnpm run build:app
      # The app as it is installed: what Electrobun packs for its own updater, unpacked with Windows' own tar.
      - name: Unpack the build
        run: |
          $out = "$env:RUNNER_TEMP\app"
          New-Item -ItemType Directory -Force $out | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf packages/app/artifacts/stable-win-x64-Isoplan.tar.zst -C $out
          if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path "$out\Isoplan\bin\launcher.exe")) { Write-Error "The build holds no Isoplan\bin\launcher.exe"; exit 1 }
      - name: Sign
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) {
            "::warning::WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD are not set, so the Windows app is unsigned."
            exit 0
          }
          $pfx = "$env:RUNNER_TEMP\sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          $app = "$env:RUNNER_TEMP\app\Isoplan"
          # Resources\uninstall is a program with no extension, which signtool picks its signer by; signed as .exe.
          Copy-Item "$app\Resources\uninstall" "$app\Resources\uninstall.exe"
          $files = 'bin\launcher.exe', 'bin\bun.exe', 'bin\bspatch.exe', 'bin\zig-zstd.exe', 'bin\ElectrobunCore.dll', 'bin\libNativeWrapper.dll', 'bin\libasar.dll', 'Resources\uninstall.exe' | ForEach-Object { Join-Path $app $_ }
          & $signtool sign /f $pfx /p $env:PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $files
          if ($LASTEXITCODE) { exit 1 }
          & $signtool verify /pa $files
          if ($LASTEXITCODE) { exit 1 }
          Move-Item -Force "$app\Resources\uninstall.exe" "$app\Resources\uninstall"
      - name: Pack
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $file = "isoplan-app-$env:VERSION-win32-x64.tar.gz"
          New-Item -ItemType Directory -Force out | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -czf "out\$file" -C "$env:RUNNER_TEMP\app" Isoplan
          if ($LASTEXITCODE) { exit 1 }
          $sha = (Get-FileHash -Algorithm SHA256 "out\$file").Hash.ToLower()
          $size = (Get-Item "out\$file").Length
          "$sha  $file" | Out-File -Encoding ascii -NoNewline "out\$file.sha256"
          [ordered]@{ version = $env:VERSION; file = $file; size = $size; sha256 = $sha } | ConvertTo-Json | Out-File -Encoding utf8NoBOM "out\isoplan-app-win32-x64.json"
          "file=$file" >> $env:GITHUB_OUTPUT
          "### Windows: $file, $([math]::Round($size / 1MB, 1)) MB" >> $env:GITHUB_STEP_SUMMARY
      # The archive first and its manifest last, so no machine finds a manifest before its archive.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          gh release upload $env:TAG "out\$env:FILE" "out\$env:FILE.sha256" --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { exit 1 }
          gh release upload $env:TAG out\isoplan-app-win32-x64.json --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { exit 1 }
      - name: Remove the signing certificate
        if: always()
        run: Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\sign.pfx"

  macos:
    if: ${{ (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'app-v')) || (github.event_name == 'workflow_dispatch' && inputs.platform != 'windows') }}
    # Explicit labels, so it never runs on a GitHub-hosted Mac.
    runs-on: [self-hosted, macOS, isoplan]
    timeout-minutes: 60
    permissions:
      contents: write
    # One Mac build at a time, the newest: a newer release cancels an older one queued while the Mac
    # is offline, or running.
    concurrency:
      group: app-release-mac
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
          # A long-lived runner keeps its workspace between jobs: no build of last time's survives.
          clean: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the tag names the app's version
        id: version
        run: |
          version=$(node -p "require('./packages/app/package.json').version")
          if [ "$TAG" != "app-v$version" ]; then
            echo "The tag $TAG doesn't match packages/app/package.json, which is at $version; tag it app-v$version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$(uname -m)" in arm64) echo "arch=arm64" >> "$GITHUB_OUTPUT" ;; *) echo "arch=x64" >> "$GITHUB_OUTPUT" ;; esac

      - name: Set up a throwaway signing keychain
        # One keychain holding the Developer ID identity and its chain, the only one searched while
        # this job runs, deleted at the end (the MindOverMatter pattern). Dormant without the secrets.
        id: keychain
        env:
          P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::warning::MAC_DEVELOPER_ID_P12_BASE64 / MAC_DEVELOPER_ID_P12_PASSWORD are not set, so the macOS app is unsigned and not notarized."
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="$RUNNER_TEMP/isoplan-signing.keychain-db"
          KC_PW="$(openssl rand -base64 24)"
          echo "::add-mask::$KC_PW"
          security create-keychain -p "$KC_PW" "$KC"
          # From here on the cleanup at the end runs, whatever fails below.
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "path=$KC" >> "$GITHUB_OUTPUT"
          # No auto-lock: a keychain that locks mid-build fails signing with errSecInternalComponent.
          security set-keychain-settings "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/devid.p12"
          # Developer ID's intermediate and Apple's root, so the chain builds inside this keychain.
          curl -fsSL -o "$RUNNER_TEMP/devid-ca.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/devid-ca.cer" -k "$KC" -T /usr/bin/codesign || true
          curl -fsSL -o "$RUNNER_TEMP/root.cer" https://www.apple.com/appleca/AppleIncRootCertificate.cer
          security import "$RUNNER_TEMP/root.cer" -k "$KC" -T /usr/bin/codesign || true
          rm -f "$RUNNER_TEMP/devid-ca.cer" "$RUNNER_TEMP/root.cer"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          # The only keychain searched, with the system's roots; the default keychain is left alone.
          security list-keychains -d user -s "$KC" /System/Library/Keychains/SystemRootCertificates.keychain
          identity=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n1)
          if [ -z "$identity" ]; then
            echo "::error::MAC_DEVELOPER_ID_P12_BASE64 holds no Developer ID Application identity."
            exit 1
          fi
          echo "ELECTROBUN_DEVELOPER_ID=$identity" >> "$GITHUB_ENV"
          echo "active=true" >> "$GITHUB_OUTPUT"

      - name: Set up notarization
        # The App Store Connect API key Electrobun notarizes with. Signed without it, the app isn't notarized.
        id: notary
        if: ${{ steps.keychain.outputs.active == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && ! printf '%s' "$ELECTROBUN_DEVELOPER_ID" | grep -q "($APPLE_TEAM_ID)"; then
            echo "::error::The Developer ID identity isn't APPLE_TEAM_ID's: $ELECTROBUN_DEVELOPER_ID"
            exit 1
          fi
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_PRIVATE_KEY_BASE64" ]; then
            echo "::warning::ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY_BASE64 are not set, so the macOS app is signed but not notarized."
            echo "ELECTROBUN_SKIP_NOTARIZATION=1" >> "$GITHUB_ENV"
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYFILE="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # The secret may be the .p8 itself or the .p8 base64-encoded.
          if printf %s "$ASC_PRIVATE_KEY_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            printf "%s\n" "$ASC_PRIVATE_KEY_BASE64" > "$KEYFILE"
          else
            printf %s "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$KEYFILE" 2>/dev/null || true
          fi
          if ! grep -q "BEGIN PRIVATE KEY" "$KEYFILE"; then
            rm -f "$KEYFILE"
            echo "::error::ASC_PRIVATE_KEY_BASE64 is neither the AuthKey_*.p8 file nor that file base64-encoded."
            exit 1
          fi
          chmod 600 "$KEYFILE"
          {
            echo "ELECTROBUN_APPLEAPIKEYPATH=$KEYFILE"
            echo "ELECTROBUN_APPLEAPIKEY=$ASC_KEY_ID"
            echo "ELECTROBUN_APPLEAPIISSUER=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"
          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "keyfile=$KEYFILE" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @isoplan/app test
      - name: Prepare Electrobun's toolchain
        working-directory: packages/app
        run: |
          for try in 1 2 3; do npx electrobun prepare && exit 0; sleep $((20 * try)); done
          exit 1
      - name: Build, and sign and notarize when set up
        working-directory: packages/app
        run: pnpm run build:app
      # The app as it is installed: what Electrobun packs for its own updater, recompressed as gzip,
      # which every Mac's tar reads.
      - name: Pack
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ steps.version.outputs.arch }}
        run: |
          zst=$(ls packages/app/artifacts/*.app.tar.zst 2>/dev/null | head -n1)
          if [ -z "$zst" ]; then
            echo "::error::The build left no .app.tar.zst in packages/app/artifacts: $(ls packages/app/artifacts)"
            exit 1
          fi
          file="isoplan-app-$VERSION-darwin-$ARCH.tar.gz"
          mkdir -p out
          node -e 'const z=require("zlib"),fs=require("fs"),{pipeline}=require("stream");pipeline(fs.createReadStream(process.argv[1]),z.createZstdDecompress(),z.createGzip({level:9}),fs.createWriteStream(process.argv[2]),(e)=>{if(e){console.error(e);process.exit(1)}})' "$zst" "out/$file"
          # awk reads the whole listing: head would end tar early, which pipefail counts as a failure.
          top=$(tar -tzf "out/$file" | awk 'NR==1')
          case "$top" in Isoplan.app/*) ;; *) echo "::error::$file starts with $top, not Isoplan.app/, which the plugin's install expects"; exit 1 ;; esac
          check="$RUNNER_TEMP/check"
          rm -rf "$check" && mkdir -p "$check" && tar -xzf "out/$file" -C "$check"
          if [ "${{ steps.keychain.outputs.active }}" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "$check/Isoplan.app"
            if [ "${{ steps.notary.outputs.active }}" = "true" ]; then spctl --assess --type execute -vv "$check/Isoplan.app"; fi
          fi
          rm -rf "$check"
          sha=$(shasum -a 256 "out/$file" | cut -d' ' -f1)
          size=$(stat -f%z "out/$file")
          printf '%s  %s' "$sha" "$file" > "out/$file.sha256"
          printf '{\n  "version": "%s",\n  "file": "%s",\n  "size": %s,\n  "sha256": "%s"\n}\n' "$VERSION" "$file" "$size" "$sha" > "out/isoplan-app-darwin-$ARCH.json"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "### macOS ($ARCH): $file, $((size / 1048576)) MB" >> "$GITHUB_STEP_SUMMARY"
      # The archive first and its manifest last, so no machine finds a manifest before its archive.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.pack.outputs.file }}
          ARCH: ${{ steps.version.outputs.arch }}
        run: |
          gh release upload "$TAG" "out/$FILE" "out/$FILE.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" "out/isoplan-app-darwin-$ARCH.json" --clobber --repo "$GITHUB_REPOSITORY"
      - name: Remove the signing keychain
        if: ${{ always() && steps.keychain.outputs.created == 'true' }}
        run: |
          security list-keychains -d user -s login.keychain-db
          security delete-keychain "${{ steps.keychain.outputs.path }}" || true
          rm -f "$RUNNER_TEMP/devid.p12"
      - name: Remove the App Store Connect key
        if: ${{ always() && steps.notary.outputs.active == 'true' }}
        run: rm -f "${{ steps.notary.outputs.keyfile }}"

